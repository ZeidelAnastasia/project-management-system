server:
  port: 8080

spring:
  application:
    name: project-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/project_db}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dA==}

  services:
    task-service:
      url: ${TASK_SERVICE_URL:http://localhost:8082}
    auth-service:
      url: ${AUTH_SERVICE_URL:http://localhost:8080}

  kafka:
    topics:
      project-created: ${KAFKA_PROJECT_CREATED_TOPIC:project-created}
      project-updated: ${KAFKA_PROJECT_UPDATED_TOPIC:project-updated}
      project-archived: ${KAFKA_PROJECT_ARCHIVED_TOPIC:project-archived}
      project-restored: ${KAFKA_PROJECT_RESTORED_TOPIC:project-restored}
      project-completed: ${KAFKA_PROJECT_COMPLETED_TOPIC:project-completed}
      project-member-added: ${KAFKA_PROJECT_MEMBER_ADDED_TOPIC:project-member-added}
      project-member-removed: ${KAFKA_PROJECT_MEMBER_REMOVED_TOPIC:project-member-removed}
      project-member-role-updated: ${KAFKA_PROJECT_MEMBER_ROLE_UPDATED_TOPIC:project-member-role-updated}
    outbox:
      batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:100}
      publish-interval-ms: ${KAFKA_OUTBOX_PUBLISH_INTERVAL_MS:5000}
      send-timeout-ms: ${KAFKA_OUTBOX_SEND_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never