
server:
  port: 8080

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/notification_db}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dA==}

  services:
    task-service:
      url: ${TASK_SERVICE_URL:http://localhost:8083}
      token: ${TASK_SERVICE_INTERNAL_TOKEN}

  kafka:
    topics:
      task-assigned: ${KAFKA_TASK_ASSIGNED_TOPIC:task-assigned}
      task-status-changed: ${KAFKA_TASK_STATUS_CHANGED_TOPIC:task-status-changed}
      comment-created: ${KAFKA_COMMENT_CREATED_TOPIC:comment-created}
  notifications:
    deadline-reminder-days: ${DEADLINE_REMINDER_DAYS:1}
    deadline-reminder-cron: ${DEADLINE_REMINDER_CRON:0 0 9 * * *}
    time-zone: ${DEADLINE_REMINDER_TIME_ZONE:Europe/Moscow}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
