
server:
  port: 8080

spring:
  application:
    name: task-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/task_db}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dA==}

  services:
    project-service:
      url: ${PROJECT_SERVICE_URL:http://localhost:8081}
    auth-service:
      url: ${AUTH_SERVICE_URL:http://localhost:8080}

  kafka:
    topics:
      task-created: ${KAFKA_TASK_CREATED_TOPIC:task-created}
      task-updated: ${KAFKA_TASK_UPDATED_TOPIC:task-updated}
      task-status-changed: ${KAFKA_TASK_STATUS_CHANGED_TOPIC:task-status-changed}
      task-assigned: ${KAFKA_TASK_ASSIGNED_TOPIC:task-assigned}
      task-deadline-changed: ${KAFKA_TASK_DEADLINE_CHANGED_TOPIC:task-deadline-changed}
      task-effort-updated: ${KAFKA_TASK_EFFORT_UPDATED_TOPIC:task-effort-updated}
      task-deleted: ${KAFKA_TASK_DELETED_TOPIC:task-deleted}

  time-zone: ${TASK_SERVICE_TIME_ZONE:Europe/Moscow}
  internal:
    token: ${TASK_SERVICE_INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
