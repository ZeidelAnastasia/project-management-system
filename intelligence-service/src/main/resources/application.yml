
server:
  port: 8080

spring:
  application:
    name: intelligence-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/intelligence_db}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: intelligence-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.projectmanagement.*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

app:
  ml:
    model-path: ${MODEL_PATH:./models/effort-model.bundle}

  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dA==}

  kafka:
    topics:
      project-created: ${KAFKA_PROJECT_CREATED_TOPIC:project-created}
      project-updated: ${KAFKA_PROJECT_UPDATED_TOPIC:project-updated}
      project-archived: ${KAFKA_PROJECT_ARCHIVED_TOPIC:project-archived}
      project-restored: ${KAFKA_PROJECT_RESTORED_TOPIC:project-restored}
      project-completed: ${KAFKA_PROJECT_COMPLETED_TOPIC:project-completed}
      task-created: ${KAFKA_TASK_CREATED_TOPIC:task-created}
      task-updated: ${KAFKA_TASK_UPDATED_TOPIC:task-updated}
      task-assigned: ${KAFKA_TASK_ASSIGNED_TOPIC:task-assigned}
      task-status-changed: ${KAFKA_TASK_STATUS_CHANGED_TOPIC:task-status-changed}
      task-deadline-changed: ${KAFKA_TASK_DEADLINE_CHANGED_TOPIC:task-deadline-changed}
      task-effort-updated: ${KAFKA_TASK_EFFORT_UPDATED_TOPIC:task-effort-updated}
      task-deleted: ${KAFKA_TASK_DELETED_TOPIC:task-deleted}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
