
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: project-task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/projects/*/tasks,/api/projects/*/tasks/**
              order: -1

            - id: project-service
              uri: ${PROJECT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/projects/**

            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/tasks/**

            - id: communication-service
              uri: ${COMMUNICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/comments/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**

            - id: reporting-service
              uri: ${REPORTING_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/reports/**

            - id: intelligence-service
              uri: ${INTELLIGENCE_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/analysis/**,/api/projects/*/risk/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dA==}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
    exposed-headers: ${CORS_EXPOSED_HEADERS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
